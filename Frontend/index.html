<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #0f172a, #2563eb);
        }

        .contact-box {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 40% 60%;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */

        .info {
            padding: 45px 35px;
            color: white;
            background: linear-gradient(160deg, #2563eb, #4f46e5);
        }

        .info h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .info p {
            color: #e0e7ff;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .info-item {
            margin-bottom: 22px;
        }

        .info-item h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .info-item span {
            font-size: 14px;
            color: #dbeafe;
        }

        /* Right Side */

        .form-area {
            padding: 45px;
        }

        .form-area h2 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .form-area > p {
            color: #64748b;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-group textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .contact-box {
                grid-template-columns: 1fr;
            }

            .info {
                padding: 30px;
            }

            .form-area {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="contact-box">

        <!-- Information Section -->

        <div class="info">

            <h1>Let's Connect</h1>

            <p>
                Have a question or want to share something with us?
                Send us your message using the form.
            </p>

            <div class="info-item">
                <h3>📧 Email</h3>
                <span>support@example.com</span>
            </div>

            <div class="info-item">
                <h3>📞 Phone</h3>
                <span>+91 98765 43210</span>
            </div>

            <div class="info-item">
                <h3>📍 Location</h3>
                <span>India</span>
            </div>

        </div>


        <!-- Contact Form -->

        <div class="form-area">

            <h2>Contact Us</h2>

            <p>Fill in your details and send us a message.</p>

            <form
                action="https://armory-reclaim-croak.ngrok-free.dev/submit.php"
                method="POST"
            >

                <!-- Name -->

                <div class="input-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Message -->

                <div class="input-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Enter your message"
                        required
                    ></textarea>

                </div>


                <button type="submit" class="submit-btn">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</body>
</html>
